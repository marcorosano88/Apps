<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gestione Orto</title>
  <meta name="description" content="Gestisci i tuoi orti: verdure, annaffiature, concimi, raccolti, calendario delle semine, rotazione e spese.">
  <meta name="theme-color" content="#2E7D32">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gestione Orto">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:24px;font-family:sans-serif">Gestione Orto richiede JavaScript per funzionare.</p></noscript>
  <script>
    /* Browser vecchi (es. Safari di iOS 9/10): niente async/await, ??, fetch...: carica la build transpilata in js/legacy/. */
    (function () {
      var moderno = true;
      try { new Function('async function f(){ await 1; } var a = null; a ?? 1; var o = {}; ({ ...o });'); } catch (e) { moderno = false; }
      if (/[?&]legacy/.test(location.search)) moderno = false; // per provare la build vecchia da un browser moderno
      var base = moderno ? 'js/' : 'js/legacy/';
      var elenco = ['data', 'logic', 'store', 'ui', 'views', 'forms', 'app', 'push'];
      if (!moderno) {
        elenco.unshift('polyfill');
        document.write('<link rel="stylesheet" href="css/legacy.css">');
      }
      for (var i = 0; i < elenco.length; i++) document.write('<script src="' + base + elenco[i] + '.js"><\/script>');
      window.onerror = function (msg, src, riga) {
        var v = document.getElementById('app');
        if (v && !v.firstChild) {
          var p = document.createElement('p');
          p.style.cssText = 'padding:20px;color:#b00020;word-break:break-word';
          p.textContent = 'Errore: ' + msg + ' (' + String(src).split('/').pop() + ':' + riga + ')';
          v.appendChild(p);
        }
      };
    })();
  </script>
</body>
</html>

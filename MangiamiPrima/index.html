<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mangiami Prima</title>
  <meta name="description" content="Tieni traccia di cosa hai in casa, delle scadenze e scopri cosa cucinare.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="76x76" href="icons/touch-76.png?v=2">
  <link rel="apple-touch-icon" sizes="120x120" href="icons/touch-120.png?v=2">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/touch-152.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/touch-180.png?v=2">
  <link rel="apple-touch-icon" href="icons/touch-180.png?v=2">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mangiami Prima">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="css/stile.css">
</head>
<body>
  <header class="barra">
    <button type="button" class="indietro" id="indietro" aria-label="Indietro" hidden>&#8249;</button>
    <h1 id="titolo">MANGIAMI PRIMA</h1>
  </header>

  <main id="vista" tabindex="-1"></main>

  <dialog id="dialogo" aria-labelledby="dialogo-titolo">
    <h2 id="dialogo-titolo"></h2>
    <p id="dialogo-testo"></p>
    <div class="dialogo-bottoni" id="dialogo-bottoni"></div>
  </dialog>

  <noscript><p style="padding:20px">Mangiami Prima richiede JavaScript.</p></noscript>

  <script>
    /* Browser vecchi (es. Safari di iOS 9/10): niente async/await, ??, fetch...: carica la build transpilata in js/legacy/. */
    (function () {
      var moderno = true;
      try { new Function('async function f(){ await 1; } var a = null; a ?? 1; var o = {}; ({ ...o });'); } catch (e) { moderno = false; }
      if (/[?&]legacy\b/.test(location.search)) moderno = false; // per provare la build vecchia da un browser moderno
      var base = moderno ? 'js/' : 'js/legacy/';
      var elenco = ['store', 'servizi', 'push', 'notifiche', 'app'];
      if (!moderno) {
        elenco.unshift('polyfill');
        document.write('<link rel="stylesheet" href="css/legacy.css">');
      }
      for (var i = 0; i < elenco.length; i++) document.write('<script src="' + base + elenco[i] + '.js"><\/script>');
      window.onerror = function (msg, src, riga) {
        var v = document.getElementById('vista');
        if (v && !v.firstChild) {
          var p = document.createElement('p');
          p.style.cssText = 'padding:20px;color:#b00020;word-break:break-word';
          p.textContent = 'Errore: ' + msg + ' (' + String(src).split('/').pop() + ':' + riga + ')';
          v.appendChild(p);
        }
      };
    })();
  </script>
</body>
</html>
